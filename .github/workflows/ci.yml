name: Tests

on:
  push:
    branches: [main, feat/postgres-backup-restore-runbook, feat/offsite-backup-reliability]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: knowledge_base_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_base_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/knowledge_base_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate backup shell scripts
        run: |
          bash -n scripts/backup_postgres.sh
          bash -n scripts/verify_postgres_backup.sh
          bash -n scripts/offsite_postgres_backup.sh
          systemd-analyze calendar '*-*-* 00/6:00:00'
          systemd-analyze calendar '*-*-* 03:00:00'

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          AUTH_SECRET_KEY: ci-auth-secret-key-with-more-than-32-characters
        run: |
          docker compose config --quiet
          python - <<'PY'
          import json
          import subprocess

          config = json.loads(
              subprocess.check_output(
                  ["docker", "compose", "config", "--format", "json"],
                  text=True,
              )
          )
          api_environment = config["services"]["api"]["environment"]
          required = {
              "AI_ASK_IP_LIMIT",
              "AI_ASK_IDENTITY_LIMIT",
              "AI_ASK_WINDOW_SECONDS",
              "AI_SEARCH_IP_LIMIT",
              "AI_SEARCH_IDENTITY_LIMIT",
              "AI_SEARCH_WINDOW_SECONDS",
          }
          missing = sorted(required - api_environment.keys())
          if missing:
              raise SystemExit(
                  "Docker Compose does not pass AI rate-limit settings to the API: "
                  + ", ".join(missing)
              )
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Embedding inference is lazy and mocked in CI tests. Keep the
          # production-only SentenceTransformers/Torch stack out of CI so
          # pip does not download multi-gigabyte CUDA runtime wheels.
          python - <<'PY'
          from pathlib import Path

          requirements = [
              line
              for line in Path("requirements.txt").read_text().splitlines()
              if not line.strip().startswith("sentence-transformers")
          ]
          Path("/tmp/requirements-ci.txt").write_text(
              "\n".join(requirements) + "\n"
          )
          PY
          pip install -r /tmp/requirements-ci.txt

      - name: Verify PostgreSQL connection
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d knowledge_base_test -v ON_ERROR_STOP=1 -c "SELECT current_user, current_database();"

      - name: Verify database migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres@localhost:5432/knowledge_base_test
          PGPASSWORD: postgres
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -v

      - name: Exercise Compose backup and restore scripts
        env:
          POSTGRES_PASSWORD: postgres
          AUTH_SECRET_KEY: ci-auth-secret-key-with-more-than-32-characters
        run: |
          set -eu
          export COMPOSE_PROJECT_NAME="mindbase-backup-restore-${GITHUB_RUN_ID}"
          export DB_PORT="$((20000 + GITHUB_RUN_ID % 20000))"
          export DATABASE_URL="postgresql+psycopg2://postgres@127.0.0.1:${DB_PORT}/knowledge_base"
          export PGPASSWORD="$POSTGRES_PASSWORD"
          trap 'docker compose down --volumes --remove-orphans >/dev/null 2>&1 || true' EXIT

          docker compose up -d --wait db
          docker compose exec -T db pg_isready -U postgres -d knowledge_base
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["DATABASE_URL"])
          assert url.password is None
          with create_engine(url).connect() as connection:
              print("SQLAlchemy connection verified:", connection.exec_driver_sql("SELECT current_database()").scalar_one())
          PY
          psql -h 127.0.0.1 -p "$DB_PORT" -U postgres -d knowledge_base -v ON_ERROR_STOP=1 -c "SELECT current_user, current_database();"
          python -m alembic upgrade head

          backup_path="$(bash scripts/backup_postgres.sh)"
          test -s "$backup_path"
          test -s "$backup_path.sha256"
          bash scripts/verify_postgres_backup.sh "$backup_path"

          corrupt_path="${backup_path}.corrupt"
          cp "$backup_path" "$corrupt_path"
          cp "$backup_path.sha256" "$corrupt_path.sha256"
          printf 'corruption-test' >> "$corrupt_path"
          if bash scripts/verify_postgres_backup.sh "$corrupt_path"; then
            echo "Restore verifier accepted a corrupted backup" >&2
            exit 1
          fi
          rm -f "$corrupt_path" "$corrupt_path.sha256"
