name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: knowledge_base_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_base_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/knowledge_base_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          AUTH_SECRET_KEY: ci-auth-secret-key-with-more-than-32-characters
        run: docker compose config --quiet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PostgreSQL connection
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d knowledge_base_test -v ON_ERROR_STOP=1 -c "SELECT current_user, current_database();"

      - name: Verify database migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres@localhost:5432/knowledge_base_test
          PGPASSWORD: postgres
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -v
