name: Frontend checks

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript and build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend container image
        run: docker build --build-arg VITE_API_URL=http://localhost:8000 -t mindbase-frontend:ci .

      - name: Smoke test frontend container
        run: |
          set -eux
          docker run --detach --name mindbase-frontend-smoke --publish 127.0.0.1:8080:80 mindbase-frontend:ci
          trap 'docker rm --force mindbase-frontend-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8080/ -o /tmp/mindbase-index.html; then
              break
            fi
            sleep 1
          done

          # The app shell and SPA fallback must both serve the built entry point.
          grep -q 'id="root"' /tmp/mindbase-index.html
          curl --fail --silent http://127.0.0.1:8080/documents/42 -o /tmp/mindbase-route.html
          grep -q 'id="root"' /tmp/mindbase-route.html

          # Security headers must be present on HTML and fingerprinted assets.
          curl --fail --silent --dump-header /tmp/mindbase-root.headers -o /dev/null http://127.0.0.1:8080/
          curl --fail --silent --dump-header /tmp/mindbase-route.headers -o /dev/null http://127.0.0.1:8080/documents/42
          cat /tmp/mindbase-root.headers /tmp/mindbase-route.headers
          for headers in /tmp/mindbase-root.headers /tmp/mindbase-route.headers; do
            grep -Eiq '^X-Content-Type-Options: nosniff\r?$' "$headers"
            grep -Eiq '^X-Frame-Options: DENY\r?$' "$headers"
            grep -Eiq '^Referrer-Policy: strict-origin-when-cross-origin\r?$' "$headers"
            grep -Eiq '^Permissions-Policy: camera=\(\), microphone=\(\), geolocation=\(\)\r?$' "$headers"
            grep -Eiq "^Content-Security-Policy:.*default-src 'self'.*object-src 'none'.*frame-ancestors 'none'.*script-src 'self'" "$headers"
          done

          # HTML must be revalidated, while fingerprinted build assets are immutable.
          grep -Eiq '^Cache-Control: no-cache\r?$' /tmp/mindbase-root.headers
          asset_path="$(grep -oE '/assets/[^"]+\.(js|css)' /tmp/mindbase-index.html | head -n 1)"
          test -n "$asset_path"
          curl --fail --silent --dump-header /tmp/mindbase-asset.headers -o /dev/null "http://127.0.0.1:8080$asset_path"
          cat /tmp/mindbase-asset.headers
          grep -Eiq '^Cache-Control: public, max-age=31536000, immutable\r?$' /tmp/mindbase-asset.headers
          grep -Eiq '^Permissions-Policy: camera=\(\), microphone=\(\), geolocation=\(\)\r?$' /tmp/mindbase-asset.headers
          grep -Eiq "^Content-Security-Policy:.*default-src 'self'.*object-src 'none'.*frame-ancestors 'none'.*script-src 'self'" /tmp/mindbase-asset.headers
